<!--Level-2 Problem 3: College Event Management Dashboard

Scenario:
Design a responsive dashboard for managing college events including event list, add event form, and navigation.

📌 Requirements
- Use Bootstrap navbar with collapse functionality.
- Implement responsive grid layout for dashboard sections.
- Use form components for event registration.
- Implement modal for adding new events.
- Use Bootstrap utilities for alignment and spacing.




🛠️ Technical Constraints
- Use Bootstrap 5 CDN.
- No external UI frameworks.
- Proper breakpoint usage (sm, md, lg, xl).
- Modal must work using Bootstrap JS bundle.

Expectations:
- Dashboard layout adapts across devices.
- Modal opens and closes correctly.
- Form fields use proper Bootstrap validation styling.

🎯 Learning Outcome
- Implement advanced components like modals.
- Create structured responsive dashboards.
- Apply responsive behaviors effectively.

------------------------------------------------------------



-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Event Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">College Events</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Events</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Registrations</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== Dashboard Content ===== -->
<div class="container py-5">

    <!-- Header + Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Event Dashboard</h2>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addEventModal">
            + Add Event
        </button>
    </div>

    <!-- Responsive Grid -->
    <div class="row g-4">

        <!-- Event Card 1 -->
        <div class="col-12 col-md-6 col-lg-4 col-xl-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Tech Fest 2026</h5>
                    <p class="card-text">Date: March 15, 2026</p>
                    <span class="badge bg-success">Open</span>
                </div>
            </div>
        </div>

        <!-- Event Card 2 -->
        <div class="col-12 col-md-6 col-lg-4 col-xl-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Cultural Night</h5>
                    <p class="card-text">Date: April 10, 2026</p>
                    <span class="badge bg-warning text-dark">Upcoming</span>
                </div>
            </div>
        </div>

        <!-- Event Card 3 -->
        <div class="col-12 col-md-6 col-lg-4 col-xl-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Hackathon</h5>
                    <p class="card-text">Date: May 5, 2026</p>
                    <span class="badge bg-danger">Closed</span>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- ===== Modal for Adding Event ===== -->
<div class="modal fade" id="addEventModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Add New Event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form class="needs-validation" novalidate>

                    <div class="mb-3">
                        <label class="form-label">Event Name</label>
                        <input type="text" class="form-control" required>
                        <div class="invalid-feedback">
                            Please enter event name.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Event Date</label>
                        <input type="date" class="form-control" required>
                        <div class="invalid-feedback">
                            Please select a date.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Event Type</label>
                        <select class="form-select" required>
                            <option value="">Choose...</option>
                            <option>Technical</option>
                            <option>Cultural</option>
                            <option>Sports</option>
                        </select>
                        <div class="invalid-feedback">
                            Please select event type.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Save Event
                    </button>

                </form>
            </div>

        </div>
    </div>
</div>

<!-- ===== Bootstrap JS Bundle (Required for Modal) ===== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Bootstrap Validation Script -->
<script>
(() => {
    'use strict'
    const forms = document.querySelectorAll('.needs-validation')

    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})();
</script>

</body>
</html>
