<!-- Promise Sample -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Sample</title>
</head>
<body>
    <h1>Promise Sample</h1>
    <script>
        let promise=new promise(function(resolve,reject){
            setTimeout(function(){
                let success=True;
                if(success){
                    resolve("success")
                }else{
                    reject("Not success")
                }
            },2000);

        });
    </script>
</body>
</html>
