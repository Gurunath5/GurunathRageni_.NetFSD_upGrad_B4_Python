<!--Problem 1: Greeting Generator (Level-1)
Scenario
A simple webpage should greet users based on the name they enter. This helps beginners understand how JavaScript functions accept parameters and how variables behave inside functions.
📌 Requirements
Create an input box to enter a user’s name.
Create a button labeled “Generate Greeting”.
When the button is clicked:
A JavaScript function should accept the name as a parameter.
Display a greeting message like:
“Hello, Rahul! Welcome to our website.”
Display the greeting inside a <p> element.-->


<!DOCTYPE html>
<html>
<head>
    <title>Personal Notes Saver</title>
</head>
<body>

    <h2>My Daily Notes</h2>

     
    <textarea id="noteArea" rows="10" cols="40" placeholder="Write your notes here..."></textarea>
    <br><br>

    <!-- Buttons with inline onclick -->
    <button onclick="saveNote()">Save</button>
    <button onclick="clearNote()">Clear</button>
    <script>
        // Load note automatically when page loads
        window.onload = function() {
            let savedNote = localStorage.getItem("myNote");
            if (savedNote !== null) {
                document.getElementById("noteArea").value = savedNote;
            }
        };

        // Save note to localStorage
        function saveNote() {
            let note = document.getElementById("noteArea").value;
            localStorage.setItem("myNote", note);
            alert("Note saved successfully!");
        }

        // Clear note from textarea and localStorage
        function clearNote() {
            localStorage.removeItem("myNote");
            document.getElementById("noteArea").value = "";
            alert("Note cleared!");
        }
    </script>
</body>
</html>
