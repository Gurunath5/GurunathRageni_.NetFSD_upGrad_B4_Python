<!DOCTYPE html>
<html>
<head>
    <title>Mini Expense Tracker</title>
</head>
<body>

<h2>Mini Expense Tracker</h2>

<label>Title:</label>
<input type="text" id="title"><br><br>

<label>Amount:</label>
<input type="number" id="amount"><br><br>

<label>Date:</label>
<input type="date" id="date"><br><br>

<button onclick="addExpense()">Add Expense</button>
<button onclick="viewExpenses()">View Expenses</button>

<h3>Expense List</h3>
<ul id="expenseList"></ul>

<p id="error" style="color:red;"></p>

<script>

let db;

//  CREATE DATABASE + TABLE
let request = indexedDB.open("ExpenseDB", 1);

request.onupgradeneeded = function(event) {
    db = event.target.result;

    // Simulates: CREATE TABLE expenses
    let objectStore = db.createObjectStore("expenses", {
        keyPath: "id",
        autoIncrement: true
    });

    objectStore.createIndex("title", "title", { unique: false });
};

request.onsuccess = function(event) {
    db = event.target.result;
    console.log("Database opened successfully");
};

request.onerror = function(event) {
    document.getElementById("error").innerText =
        "Database error: " + event.target.errorCode;
};

//  INSERT → add()
function addExpense() {

    let title = document.getElementById("title").value;
    let amount = document.getElementById("amount").value;
    let date = document.getElementById("date").value;

    if (!title || !amount || !date) {
        alert("All fields required");
        return;
    }

    let transaction = db.transaction(["expenses"], "readwrite");

    transaction.onerror = function() {
        document.getElementById("error").innerText =
            "Transaction failed";
    };

    let store = transaction.objectStore("expenses");

    let expense = {
        title: title,
        amount: amount,
        date: date
    };

    let addRequest = store.add(expense);

    addRequest.onsuccess = function() {
        alert("Expense Added Successfully");
        viewExpenses();
    };

    addRequest.onerror = function() {
        document.getElementById("error").innerText =
            "Error adding expense";
    };
}

//  SELECT → getAll()
function viewExpenses() {

    let transaction = db.transaction(["expenses"], "readonly");
    let store = transaction.objectStore("expenses");

    let request = store.getAll();

    request.onsuccess = function(event) {

        let expenses = event.target.result;

        let list = document.getElementById("expenseList");
        list.innerHTML = "";

        expenses.forEach(function(exp) {

            let li = document.createElement("li");
            li.innerHTML =
                exp.title + " | ₹" + exp.amount + " | " + exp.date +
                " <button onclick='deleteExpense(" + exp.id + ")'>Delete</button>";

            list.appendChild(li);
        });
    };

    request.onerror = function() {
        document.getElementById("error").innerText =
            "Error fetching expenses";
    };
}

//  DELETE → delete()
function deleteExpense(id) {

    let transaction = db.transaction(["expenses"], "readwrite");
    let store = transaction.objectStore("expenses");

    let request = store.delete(id);

    request.onsuccess = function() {
        alert("Expense Deleted");
        viewExpenses();
    };

    request.onerror = function() {
        document.getElementById("error").innerText =
            "Error deleting expense";
    };
}

</script>

</body>
</html>
